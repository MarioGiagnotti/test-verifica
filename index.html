
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1d2433;--mut:#6b7488;--pri:#2f5bea;--ok:#16a34a;--bd:#d9deea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2b8;--pri:#6f93ff;--ok:#34d27b;--bd:#2c3348}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ecf5;--mut:#98a2b8;--pri:#6f93ff;--ok:#34d27b;--bd:#2c3348}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.protect,.protect *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.protect img{pointer-events:none}
@media print{body{display:none!important}}
.wrap{max-width:560px;margin:8vh auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px}
h1{margin:0 0 6px;font-size:24px}p{color:var(--mut);line-height:1.5}
input[type=text]{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;margin:8px 0 16px;-webkit-user-select:text;user-select:text}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:16px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);cursor:pointer;margin-top:18px;font-size:13px;text-decoration:underline}
#quiz{display:none;position:fixed;inset:0;background:var(--bg);flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#quiz.on{display:flex}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd);background:var(--card)}
.main{flex:1;display:flex;min-height:0}
.side{width:170px;border-right:1px solid var(--bd);background:var(--card);padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.side button{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);cursor:pointer;text-align:left;font-size:14px}
.side button.cur{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset;font-weight:600}
.center{flex:1;padding:28px;overflow-y:auto}
.q{font-size:20px;font-weight:600;margin-bottom:20px;line-height:1.4}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:10px;cursor:pointer;font-size:16px}
.opt.sel{border-color:var(--pri)}
.box{width:22px;height:22px;border:2px solid var(--mut);border-radius:5px;flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.opt.sel .box{background:var(--pri);border-color:var(--pri)}
.bottom{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:1px solid var(--bd);background:var(--card)}
.sq{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.sq i{width:26px;height:26px;border-radius:6px;background:var(--bd);display:block}
.sq i.done{background:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;padding:16px;z-index:9}
.modal.on{display:grid}
.modal .card{max-width:440px;width:100%;text-align:center}
.big{font-size:44px;font-weight:700;color:var(--pri);margin:8px 0}
code{display:block;word-break:break-all;background:var(--bg);padding:10px;border-radius:8px;font-size:12px;-webkit-user-select:text;user-select:text;margin:8px 0}
table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd)}
#doc .card{max-width:980px}.tw{overflow-x:auto}.ok{color:var(--ok);font-weight:700}.ko{color:#dc2626;font-weight:700}textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:13px;margin:8px 0;-webkit-user-select:text;user-select:text}
@media (max-width:640px){.side{width:96px;padding:8px}.side button{font-size:12px;padding:8px 6px}.center{padding:16px}}
</style>

<body class="protect">

<div class="wrap" id="home">
  <div class="card">
    <h1 id="t">Verifica</h1>
    <p id="desc"></p>
    <p id="dur" style="margin-top:-8px"></p>
    <label for="nome">Nome e cognome</label>
    <input type="text" id="nome" autocomplete="off" placeholder="Es. Mario Rossi">
    <button class="btn" id="start">Apri la verifica</button><br>
    <button class="link" id="docBtn">Area docente</button>
  </div>
</div>

<div id="quiz">
  <div class="top"><strong id="who"></strong><strong id="timer" style="font-size:20px;font-variant-numeric:tabular-nums"></strong><span id="prog" style="color:var(--mut)"></span></div>
  <div class="main">
    <div class="side" id="side"></div>
    <div class="center"><div class="q" id="qt"></div><div id="opts"></div></div>
  </div>
  <div class="bottom"><div class="sq" id="sq"></div><button class="btn" id="submit">Consegna</button></div>
</div>

<div class="modal" id="res"><div class="card">
  <h2 style="margin:0">Verifica consegnata</h2>
  <div class="big" id="score"></div>
  <p id="saved"></p>
  <p style="margin-bottom:0;font-size:13px">Codice di consegna (conservalo):</p><code id="code"></code>
  <button class="btn sec" id="copy">Copia codice</button> <button class="btn" id="exit">Esci</button>
</div></div>

<div class="modal" id="dup"><div class="card">
  <h2 style="margin:0 0 8px">Verifica già eseguita</h2>
  <p>Hai già consegnato questa verifica da questo dispositivo. Non è possibile ripeterla.</p>
  <p style="margin-bottom:0;font-size:13px">Il tuo codice di consegna:</p><code id="code2"></code>
  <button class="btn sec" id="copy2">Copia codice</button> <button class="btn" id="dupok">Chiudi</button>
</div></div>

<div class="modal" id="confirm"><div class="card">
  <h3 id="cmsg" style="margin-top:0"></h3>
  <button class="btn sec" id="cno">Torna alla verifica</button> <button class="btn" id="cyes">Consegna</button>
</div></div>

<div class="modal" id="doc"><div class="card" style="max-height:90vh;overflow:auto;text-align:left">
  <h3 style="margin-top:0">Area docente</h3>
  <div id="pinbox"><input type="text" id="pin" placeholder="PIN docente"><button class="btn" id="pinok">Entra</button></div>
  <div id="docbody" style="display:none">
    <p>Incolla i codici di consegna degli studenti (uno per riga, copiati da Classroom):</p>
    <textarea id="paste" placeholder="Un codice per riga"></textarea>
    <button class="btn" id="dec">Aggiungi ai risultati</button> <button class="btn sec" id="clr">Svuota elenco</button>
    <p id="decout"></p>
    <div class="tw" id="tab"></div>
  </div>
  <button class="link" id="docx">Chiudi</button>
</div></div>

<script>
/* ===================== CONFIGURAZIONE (modificabile) ===================== */
const TITOLO = "Verifica di Cultura Generale";
const DESCRIZIONE = "10 domande a risposta multipla. Una sola risposta corretta per domanda. Buon lavoro!";
const PIN_DOCENTE = "1234";
const DURATA_MINUTI = 120; // durata della verifica in minuti (120 = 2 ore)
const DOMANDE = [
 {q:"Qual è la capitale d'Italia?",o:["Milano","Roma","Napoli","Torino"],c:1},
 {q:"Quanto fa 7 × 8?",o:["54","56","58","64"],c:1},
 {q:"Chi scrisse «La Divina Commedia»?",o:["Petrarca","Boccaccio","Dante Alighieri","Manzoni"],c:2},
 {q:"Qual è il simbolo chimico dell'acqua?",o:["O2","CO2","H2O","HO"],c:2},
 {q:"In che anno è iniziata la Rivoluzione francese?",o:["1689","1789","1815","1848"],c:1},
 {q:"Qual è il pianeta più grande del Sistema solare?",o:["Terra","Saturno","Marte","Giove"],c:3},
 {q:"Quale fiume attraversa Firenze?",o:["Tevere","Po","Arno","Adige"],c:2},
 {q:"Quanti lati ha un esagono?",o:["5","6","7","8"],c:1},
 {q:"Chi dipinse la «Gioconda»?",o:["Michelangelo","Raffaello","Caravaggio","Leonardo da Vinci"],c:3},
 {q:"Qual è il continente più esteso?",o:["Africa","Europa","Asia","America"],c:2}
];
/* ========================================================================= */
const $=id=>document.getElementById(id);
let cur=0,ans=Array(DOMANDE.length).fill(null),nome="",done=false;
$("t").textContent=TITOLO;$("desc").textContent=DESCRIZIONE;document.title=TITOLO;
{const h=Math.floor(DURATA_MINUTI/60),m=DURATA_MINUTI%60;$("dur").textContent="Durata: "+(h?h+(h>1?" ore":" ora"):"")+(h&&m?" e ":"")+(m?m+" minuti":"")+". Il timer parte quando clicchi «Apri la verifica» e non si ferma."}

/* --- protezione anti copia --- */
["copy","cut","contextmenu","dragstart","selectstart"].forEach(e=>document.addEventListener(e,ev=>{const t=ev.target.nodeType===1?ev.target:ev.target.parentElement;if(!(t&&t.closest("input,textarea,code")))ev.preventDefault()}));
document.addEventListener("keydown",e=>{
  if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&["c","x","a","p","s","u"].includes(k)||e.key==="F12"||e.key==="PrintScreen")e.preventDefault();
});

function render(){
  const d=DOMANDE[cur];
  $("qt").textContent=(cur+1)+". "+d.q;
  $("opts").innerHTML="";
  d.o.forEach((t,i)=>{
    const el=document.createElement("div");el.className="opt"+(ans[cur]===i?" sel":"");
    el.innerHTML='<span class="box">'+(ans[cur]===i?"✓":"")+'</span><span></span>';
    el.lastChild.textContent=t;
    el.onclick=()=>{if(done)return;ans[cur]=i;render()};
    $("opts").appendChild(el);
  });
  $("side").innerHTML="";
  DOMANDE.forEach((_,i)=>{const b=document.createElement("button");b.textContent="Domanda "+(i+1);if(i===cur)b.className="cur";b.onclick=()=>{cur=i;render()};$("side").appendChild(b)});
  saveState();$("sq").innerHTML=ans.map(a=>'<i class="'+(a!==null?"done":"")+'"></i>').join("");
  $("prog").textContent="Risposte: "+ans.filter(a=>a!==null).length+" / "+DOMANDE.length;
}
const KEY="verifica_consegnata_"+encodeURIComponent(TITOLO);
const KEY2="verifica_incorso_"+encodeURIComponent(TITOLO);
const DUR=DURATA_MINUTI*60000;let t0=0,tm=null;
function saveState(){if(!t0||done)return;try{localStorage.setItem(KEY2,JSON.stringify({n:nome,s:t0,a:ans}))}catch(e){}}
function tick(){
  const left=Math.max(0,t0+DUR-Date.now()),s=Math.ceil(left/1000),p=n=>String(n).padStart(2,"0");
  $("timer").textContent="⏱ "+p(Math.floor(s/3600))+":"+p(Math.floor(s%3600/60))+":"+p(s%60);
  $("timer").style.color=left<300000?"#dc2626":"";
  if(left<=0)consegna(true);
}
function begin(){
  $("home").style.display="none";$("quiz").classList.add("on");$("who").textContent=nome;render();
  tick();if(!done)tm=setInterval(tick,1000);
}
function getDone(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function showDup(c){$("code2").textContent=c;$("dup").classList.add("on")}
$("start").onclick=()=>{
  const g=getDone();if(g){showDup(g);return}
  nome=$("nome").value.trim();
  if(nome.length<3){alert("Inserisci nome e cognome.");return}
  t0=Date.now();begin();
};
$("submit").onclick=()=>{
  const miss=ans.filter(a=>a===null).length;
  $("cmsg").textContent=miss?("Hai "+miss+" domande senza risposta. Consegnare comunque?"):"Vuoi consegnare la verifica?";
  $("confirm").classList.add("on");
};
$("cno").onclick=()=>$("confirm").classList.remove("on");
function consegna(auto){
  $("confirm").classList.remove("on");if(done)return;done=true;clearInterval(tm);$("submit").disabled=true;
  try{localStorage.removeItem(KEY2)}catch(e){}
  const punti=ans.reduce((s,a,i)=>s+(a===DOMANDE[i].c?1:0),0);
  $("score").textContent=punti+" / "+DOMANDE.length;
  const payload={n:nome,p:punti,t:DOMANDE.length,a:ans.map(a=>a===null?"-":a).join(""),d:new Date(Math.min(Date.now(),t0+DUR)).toISOString()};
  const cod=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
  $("code").textContent=cod;try{localStorage.setItem(KEY,cod)}catch(e){}
  $("saved").textContent="Hai realizzato "+punti+" punti su "+DOMANDE.length+".";
  $("res").classList.add("on");
  $("saved").textContent+=" Copia il codice qui sotto e incollalo come consegna su Classroom.";
  if(auto)$("saved").textContent="Tempo scaduto: la verifica è stata consegnata automaticamente. "+$("saved").textContent;
}
$("cyes").onclick=()=>consegna(false);
/* --- area docente --- */
$("docBtn").onclick=()=>$("doc").classList.add("on");
$("docx").onclick=()=>$("doc").classList.remove("on");
$("pinok").onclick=async()=>{
  if($("pin").value!==PIN_DOCENTE){alert("PIN errato");return}
  $("pinbox").style.display="none";$("docbody").style.display="block";table();
};
const RKEY="verifica_risultati_"+encodeURIComponent(TITOLO);
const dec=c=>JSON.parse(decodeURIComponent(escape(atob(c))));
function loadR(){try{return JSON.parse(localStorage.getItem(RKEY)||"[]")}catch(e){return[]}}
function saveR(l){try{localStorage.setItem(RKEY,JSON.stringify(l))}catch(e){}}
function table(){
  const rows=loadR().map(c=>{try{return dec(c)}catch(e){return null}}).filter(Boolean).sort((a,b)=>a.n.localeCompare(b.n));
  if(!rows.length){$("tab").textContent="Nessun risultato inserito.";return}
  const t=document.createElement("table");
  t.innerHTML="<tr><th>Studente</th><th>Punti</th><th>Data</th>"+DOMANDE.map((_,i)=>"<th>D"+(i+1)+"</th>").join("")+"</tr>";
  rows.forEach(r=>{
    const tr=t.insertRow();let p=0;
    const cells=DOMANDE.map((d,i)=>{const a=r.a[i];if(a===undefined||a==="-")return["–",""];if(+a===d.c){p++;return["✓","ok"]}return["✗","ko"]});
    [r.n,p+"/"+DOMANDE.length,new Date(r.d).toLocaleString("it-IT")].forEach(v=>tr.insertCell().textContent=v);
    cells.forEach(([s,k])=>{const td=tr.insertCell();td.textContent=s;td.className=k});
  });
  $("tab").innerHTML="";$("tab").appendChild(t);
}
$("dec").onclick=()=>{
  const l=loadR();let bad=0,add=0;
  $("paste").value.split(/\s+/).filter(Boolean).forEach(c=>{try{dec(c);if(!l.includes(c)){l.push(c);add++}}catch(e){bad++}});
  saveR(l);$("paste").value="";$("decout").textContent=add+" aggiunti"+(bad?", "+bad+" non validi":"")+".";table();
};
$("clr").onclick=()=>{if(confirm("Svuotare l'elenco?")){saveR([]);table()}};
function copyText(t,b){
  const o=b.textContent,ok=()=>{b.textContent="Copiato ✓";setTimeout(()=>b.textContent=o,1800)};
  const fb=()=>{const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}x.remove()};
  navigator.clipboard?navigator.clipboard.writeText(t).then(ok,fb):fb();
}
$("copy").onclick=e=>copyText($("code").textContent,e.target);
$("copy2").onclick=e=>copyText($("code2").textContent,e.target);
$("exit").onclick=()=>{$("res").classList.remove("on");$("quiz").classList.remove("on");$("home").style.display="";$("nome").value=""};
$("dupok").onclick=()=>$("dup").classList.remove("on");
if(getDone())showDup(getDone());
else{try{const st=JSON.parse(localStorage.getItem(KEY2)||"null");if(st){nome=st.n;t0=st.s;ans=st.a;begin()}}catch(e){}}
</script>
</body>
